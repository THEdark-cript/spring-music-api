spring.application.name=spring-music-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spring_music}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.security.jwt.secret=${JWT_SECRET:minha-chave-secreta}

logging.level.org.springframework.security=DEBUG

resilience4j.ratelimiter.instances.loginLimiter.limitForPeriod=5
resilience4j.ratelimiter.instances.loginLimiter.limitRefreshPeriod=2m
resilience4j.ratelimiter.instances.loginLimiter.timeoutDuration=0s